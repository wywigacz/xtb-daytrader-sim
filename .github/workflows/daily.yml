name: daily (rozliczenie po sesji)

# Raz dziennie po zamknieciu sesji USA: domyka resztki, robi wycene,
# dopisuje punkt do historii kapitalu i przebudowuje dashboard.

on:
  schedule:
    - cron: "10 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sim-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rozliczenie dzienne
        env:
          SIM_NOW: ""
        run: python sim/daily.py

      - name: Zapisz stan i dashboard w repo
        run: |
          git config user.name  "xtb-sim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Bez zmian - nie ma czego commitowac."
          else
            git commit -m "dzien $(date -u '+%Y-%m-%d')"
            git pull --rebase --autostash || true
            git push
          fi
