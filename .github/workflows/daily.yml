name: daily (rozliczenie po sesji)

# Raz dziennie po zamknieciu sesji USA: domyka resztki, robi wycene, dopisuje
# punkt do historii kapitalu, przebudowuje panel i robi jego zrzut do PNG,
# zeby panel dalo sie obejrzec w prywatnym repo (GitHub Pages wymaga repo
# publicznego, a my go nie otwieramy).

on:
  schedule:
    - cron: "10 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sim-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rozliczenie dzienne
        env:
          SIM_NOW: ""
        run: python sim/daily.py

      - name: Zrzut panelu do PNG (podglad w repo)
        continue-on-error: true
        run: |
          python -m pip install --quiet --disable-pip-version-check playwright pillow
          python sim/render.py --html docs/index.html --out docs/panel.png

      - name: Zapisz stan i panel w repo
        run: |
          git config user.name  "xtb-sim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Bez zmian - nie ma czego commitowac."
          else
            git commit -m "dzien $(date -u '+%Y-%m-%d')"
            git pull --rebase --autostash || true
            git push
          fi
