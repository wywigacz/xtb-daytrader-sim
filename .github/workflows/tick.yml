name: tick (sesja USA)

# Skrypt sam sprawdza, czy giełda jest naprawdę otwarta (czas Nowego Jorku,
# święta, DST) - poza sesja kończy się w kilkanascie sekund, nic nie robiac.
#
# UWAGA o niezawodnosci: GitHub NIE gwarantuje uruchomien z harmonogramu -
# przy gęstych cronach potrafi je opoznic albo pominac (tak przepadl dzien
# 2026-10-26, mimo 20 zaplanowanych uruchomien). Dlatego:
#   * cron jest gesty (co 5 minut w sesji), zeby zwiekszyc szanse,
#   * panel pokazuje ostrzezenie, gdy danego dnia nie bylo ZADNEGO sprawdzenia
#     rynku - zeby niepełny dzien nie wygladal jak normalny,
#   * `workflow_dispatch` pozwala dopchnąć sesje ręcznie.
# 13:00-20:55 UTC = okno 9:00-16:55 czasu Nowego Jorku (lato i zima).
on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"
    - cron: "3,13,23,33,43,53 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sim-state
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tick symulacji
        env:
          SIM_NOW: ""
        run: python sim/tick.py

      - name: Zapisz stan w repo
        run: |
          git config user.name  "xtb-sim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Bez zmian - nie ma czego commitowac."
          else
            git commit -m "tick $(date -u '+%Y-%m-%d %H:%MZ')"
            # -X theirs: przy konflikcie (np. plik obrazka zmieniony po obu
            # stronach) wygrywa świeżo wygenerowana wersja z tego przebiegu
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs && git push && break
              sleep 3
            done
          fi
