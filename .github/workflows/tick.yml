name: tick (sesja USA)

# Skrypt sam sprawdza, czy giełda jest naprawdę otwarta (czas Nowego Jorku,
# święta, DST) - poza sesja kończy się w kilkanascie sekund, nic nie robiac.
#
# Dwa harmonogramy, bo metoda działa najswiezej zaraz po otwarciu:
#   * 13:00-16:50 UTC co 10 minut - to okno 9:45-11:30 czasu Nowego Jorku
#     (w obu wariantach czasu letniego/zimowego),
#   * 17:00-21:50 UTC co 30 minut - reszta sesji.
on:
  schedule:
    - cron: "*/10 13-16 * * 1-5"
    - cron: "*/30 17-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sim-state
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tick symulacji
        env:
          SIM_NOW: ""
        run: python sim/tick.py

      - name: Zapisz stan w repo
        run: |
          git config user.name  "xtb-sim-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Bez zmian - nie ma czego commitowac."
          else
            git commit -m "tick $(date -u '+%Y-%m-%d %H:%MZ')"
            # -X theirs: przy konflikcie (np. plik obrazka zmieniony po obu
            # stronach) wygrywa świeżo wygenerowana wersja z tego przebiegu
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs && git push && break
              sleep 3
            done
          fi
